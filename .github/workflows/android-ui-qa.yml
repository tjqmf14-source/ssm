name: Android UI QA

on:
  push:
    branches:
      - ssm-2.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Gradle 9.6.0
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-9.6.0-bin.zip
          unzip -q /tmp/gradle.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-9.6.0/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator UI smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          disable-animations: true
          script: |
            set -euo pipefail
            mkdir -p ui-qa
            adb logcat -c
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm clear com.ssm.app
            adb shell am start -W -n com.ssm.app/.MainActivity | tee ui-qa/start.txt
            sleep 2

            dump_ui() {
              adb shell uiautomator dump /sdcard/window.xml >/dev/null
              adb pull /sdcard/window.xml ui-qa/window.xml >/dev/null
            }

            assert_text() {
              dump_ui
              python3 - "$1" <<'PY'
            import sys
            import xml.etree.ElementTree as ET
            needle = sys.argv[1]
            values = [n.attrib.get("text", "") for n in ET.parse("ui-qa/window.xml").iter("node")]
            if needle not in values:
                print("Missing UI text:", needle)
                print("Visible texts:", [v for v in values if v])
                raise SystemExit(1)
            PY
            }

            tap_text() {
              dump_ui
              coords="$(python3 - "$1" <<'PY'
            import re, sys
            import xml.etree.ElementTree as ET
            needle = sys.argv[1]
            for node in ET.parse("ui-qa/window.xml").iter("node"):
                if node.attrib.get("text", "") == needle:
                    m = re.fullmatch(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]", node.attrib.get("bounds", ""))
                    if not m:
                        break
                    x = (int(m.group(1)) + int(m.group(3))) // 2
                    y = (int(m.group(2)) + int(m.group(4))) // 2
                    print(x, y)
                    raise SystemExit(0)
            print("Unable to find tappable text:", needle, file=sys.stderr)
            raise SystemExit(1)
            PY
            )"
              read -r x y <<< "$coords"
              adb shell input tap "$x" "$y"
              sleep 1
            }

            assert_text "씀"
            assert_text "이번 달 총지출"
            adb exec-out screencap -p > ui-qa/home.png

            tap_text "내역"
            assert_text "내역"
            adb exec-out screencap -p > ui-qa/transactions.png

            tap_text "분석"
            assert_text "분석"
            assert_text "카테고리"
            adb exec-out screencap -p > ui-qa/analysis.png

            tap_text "설정"
            assert_text "설정"
            assert_text "Notion"
            adb exec-out screencap -p > ui-qa/settings.png

            tap_text "홈"
            tap_text "+ 거래 추가"
            assert_text "거래 추가"
            assert_text "카테고리"
            assert_text "결제수단"
            adb exec-out screencap -p > ui-qa/add-dialog.png
            tap_text "취소"
            assert_text "이번 달 총지출"

            adb shell dumpsys activity activities > ui-qa/activity.txt
            grep -q "com.ssm.app/.MainActivity" ui-qa/activity.txt

            adb logcat -d > ui-qa/logcat.txt
            if grep -q "FATAL EXCEPTION.*com.ssm.app" ui-qa/logcat.txt; then
              echo "Fatal app exception detected"
              exit 1
            fi

      - name: Upload UI QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssm-2-ui-qa
          path: ui-qa
          if-no-files-found: error
