name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Gradle 9.6.0
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-9.6.0-bin.zip
          unzip -q /tmp/gradle.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-9.6.0/bin" >> "$GITHUB_PATH"

      - name: Clean
        run: gradle --no-daemon clean

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Verify unit test results
        shell: bash
        run: |
          set -euo pipefail
          test -d app/build/test-results/testDebugUnitTest
          count="$(find app/build/test-results/testDebugUnitTest -type f -name '*.xml' | wc -l)"
          test "$count" -gt 0
          ! grep -R 'failures="[1-9]' app/build/test-results/testDebugUnitTest
          ! grep -R 'errors="[1-9]' app/build/test-results/testDebugUnitTest

      - name: Android lint
        run: gradle --no-daemon lintDebug

      - name: Verify lint report
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/reports/lint-results-debug.html
          warning_count="$(grep -c '<span class=\"mdl-chip__text\">Warning</span>' app/build/reports/lint-results-debug.html || true)"
          error_count="$(grep -c '<span class=\"mdl-chip__text\">Error</span>' app/build/reports/lint-results-debug.html || true)"
          test "$warning_count" -eq 0
          test "$error_count" -eq 0

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Build release bundle
        run: gradle --no-daemon bundleRelease

      - name: Verify release outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          sha256sum \
            app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/bundle/release/app-release.aab \
            > app/build/outputs/SHA256SUMS.txt
          cat app/build/outputs/SHA256SUMS.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ssm-2.0-final
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/SHA256SUMS.txt
            app/build/reports/lint-results-debug.html
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: error


  emulator-regression:
    needs: qa
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "emulator" "system-images;android-36;google_apis;x86_64"

      - name: Install Gradle 9.6.0
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-9.6.0-bin.zip
          unzip -q /tmp/gradle.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-9.6.0/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android emulator regression tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -eu
            adb shell wm size 1080x2400

            adb shell wm density 540
            adb shell settings put system font_scale 1.0
            gradle --no-daemon connectedDebugAndroidTest

            adb shell wm density 480
            adb shell settings put system font_scale 1.30
            gradle --no-daemon connectedDebugAndroidTest

            adb shell wm density 420
            adb shell settings put system font_scale 1.0
            gradle --no-daemon connectedDebugAndroidTest

      - name: Verify instrumentation results
        shell: bash
        run: |
          set -euo pipefail
          result_dir="app/build/outputs/androidTest-results/connected/debug"
          test -d "$result_dir"
          count="$(find "$result_dir" -type f -name '*.xml' | wc -l)"
          test "$count" -gt 0
          ! grep -R 'failures="[1-9]' "$result_dir"
          ! grep -R 'errors="[1-9]' "$result_dir"
          ! grep -R 'skipped="[1-9]' "$result_dir"

      - name: Upload emulator QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: ssm-2.0-emulator-regression
          path: |
            app/build/outputs/androidTest-results/connected/debug/
            app/build/reports/androidTests/connected/debug/
          if-no-files-found: error
