name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 37
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37" "build-tools;37.0.0"

      - name: Install Gradle 9.6.0
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-9.6.0-bin.zip
          unzip -q /tmp/gradle.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-9.6.0/bin" >> "$GITHUB_PATH"

      - name: Clean
        run: gradle --no-daemon clean

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Verify unit test results
        shell: bash
        run: |
          set -euo pipefail
          test -d app/build/test-results/testDebugUnitTest
          count="$(find app/build/test-results/testDebugUnitTest -type f -name '*.xml' | wc -l)"
          test "$count" -gt 0
          ! grep -R 'failures="[1-9]' app/build/test-results/testDebugUnitTest
          ! grep -R 'errors="[1-9]' app/build/test-results/testDebugUnitTest

      - name: Android lint
        run: gradle --no-daemon lintDebug

      - name: Verify lint report
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/reports/lint-results-debug.html
          warning_count="$(grep -c '<span class=\"mdl-chip__text\">Warning</span>' app/build/reports/lint-results-debug.html || true)"
          error_count="$(grep -c '<span class=\"mdl-chip__text\">Error</span>' app/build/reports/lint-results-debug.html || true)"
          test "$warning_count" -eq 0
          test "$error_count" -eq 0

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Build release bundle
        run: gradle --no-daemon bundleRelease

      - name: Verify release outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          sha256sum \
            app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/bundle/release/app-release.aab \
            > app/build/outputs/SHA256SUMS.txt
          cat app/build/outputs/SHA256SUMS.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ssm-2.0-final
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/SHA256SUMS.txt
            app/build/reports/lint-results-debug.html
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: error
