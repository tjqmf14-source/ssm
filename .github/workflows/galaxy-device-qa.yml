name: Galaxy Real Device QA

on:
  push:
    branches:
      - qa/galaxy-real-device-20260925
  workflow_dispatch:

permissions:
  contents: read

jobs:
  galaxy-real-device:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60

    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Android SDK 36
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sdkRoot = Join-Path $env:RUNNER_TEMP "android-sdk"
          $zip = Join-Path $env:RUNNER_TEMP "commandlinetools-win.zip"
          $extract = Join-Path $env:RUNNER_TEMP "android-cmdline-extract"

          Remove-Item $sdkRoot -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $zip -Force -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Force -Path $sdkRoot | Out-Null
          New-Item -ItemType Directory -Force -Path $extract | Out-Null

          Invoke-WebRequest -UseBasicParsing -Uri "https://dl.google.com/android/repository/commandlinetools-win-12266719_latest.zip" -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force

          $latest = Join-Path $sdkRoot "cmdline-tools\latest"
          New-Item -ItemType Directory -Force -Path $latest | Out-Null
          Copy-Item (Join-Path $extract "cmdline-tools\*") $latest -Recurse -Force

          $sdkManager = Join-Path $latest "bin\sdkmanager.bat"
          if (!(Test-Path $sdkManager)) { throw "sdkmanager.bat missing after extraction" }

          "ANDROID_HOME=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_SDK_ROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $sdkRoot "platform-tools") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          (Join-Path $sdkRoot "build-tools\36.0.0") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          (Join-Path $latest "bin") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          1..30 | ForEach-Object { "y" } | & $sdkManager --sdk_root=$sdkRoot --licenses | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "Android SDK license acceptance failed" }

          & $sdkManager --sdk_root=$sdkRoot "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          if ($LASTEXITCODE -ne 0) { throw "Android SDK package install failed" }

          if (!(Test-Path (Join-Path $sdkRoot "platform-tools\adb.exe"))) { throw "adb.exe missing after Android SDK install" }

      - name: Galaxy real-device QA
        shell: pwsh
        run: |
          .\scripts\galaxy-device-qa.ps1

      - name: Upload Galaxy QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: galaxy-real-device-qa-${{ github.sha }}
          path: app/build/galaxy-real-device/
          if-no-files-found: error
