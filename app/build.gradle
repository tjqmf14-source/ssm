plugins { id 'com.android.application' }

android {
    namespace = 'com.ssm.app'
    compileSdk = 36

    defaultConfig {
        applicationId = 'com.ssm.app'
        minSdk = 28
        targetSdk = 36
        versionCode = 20
        versionName = '2.0.0'
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    testOptions { unitTests.returnDefaultValues = true }

    // API 37 is still a preview SDK on the current CI channel. Stay on the
    // latest stable API 36 and suppress only the two preview-availability hints.
    lint {
        abortOnError = true
        warningsAsErrors = true
        disable += ['OldTargetApi', 'GradleDependency']
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
